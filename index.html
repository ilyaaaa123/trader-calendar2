<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Календарь трейдера — lifeSilya</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0A192F;
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            padding: 12px;
            color: #F0F4F8;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .card {
            background: #11243E;
            border-radius: 24px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #2C4F6E;
        }
        .header {
            font-size: 24px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .sub {
            color: #8BB4D0;
            font-size: 12px;
            margin: 8px 0 16px 0;
            border-left: 2px solid #2E7EB8;
            padding-left: 10px;
        }
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            border-bottom: 1px solid #2C4F6E;
            padding-bottom: 8px;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: none;
            border: none;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            color: #8BB4D0;
            cursor: pointer;
            border-radius: 30px;
        }
        .tab-btn.active {
            background: #2C5282;
            color: white;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            text-align: center;
            margin-top: 12px;
        }
        .calendar-day {
            padding: 8px 4px;
            border-radius: 30px;
            cursor: pointer;
            background: #0A1A2A;
            font-weight: bold;
            font-size: 14px;
        }
        .profit { color: #4ADE80; }
        .loss { color: #F87171; }
        .stats-row {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .stat-card {
            flex: 1;
            background: #0A1A2A;
            border-radius: 20px;
            padding: 12px;
            text-align: center;
            border: 1px solid #2C4F6E;
        }
        .stat-card .label {
            font-size: 12px;
            color: #8BB4D0;
        }
        .stat-card .value {
            font-size: 20px;
            font-weight: bold;
        }
        .telegram-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #0088cc;
            text-decoration: none;
            padding: 8px 20px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            font-size: 14px;
        }
        button {
            background: #1E6F3F;
            border: none;
            padding: 10px 16px;
            border-radius: 40px;
            font-weight: bold;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }
        button.secondary { background: #2C5282; }
        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            background: #0A1A2A;
            border: 1px solid #2E4A6A;
            border-radius: 20px;
            color: white;
            font-size: 16px;
        }
        .month-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .month-selector select { width: auto; margin-bottom: 0; }
        
        @media (max-width: 768px) {
            .calendar-day { font-size: 12px; padding: 6px 2px; }
            .tab-btn { padding: 6px 12px; font-size: 12px; }
            .stat-card .value { font-size: 16px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="header">
            📅 Календарь трейдера
            <span id="adminBadge" style="display:none; background:#9b59b6; padding:2px 8px; border-radius:20px; font-size:10px;">👑 Админ</span>
        </div>
        <div class="sub">lifeSilya • 29 валютных пар</div>
        
        <div class="tabs">
            <button class="tab-btn active" data-tab="calendar">📅 Календарь</button>
            <button class="tab-btn" data-tab="signals">🎯 Сигналы</button>
        </div>
        
        <div id="tab-calendar" class="tab-content active">
            <div class="month-selector">
                <select id="monthSelect"></select>
                <select id="yearSelect"></select>
                <button id="refreshCalendarBtn">Показать</button>
            </div>
            <div id="calendarContainer"></div>
            
            <div class="stats-row">
                <div class="stat-card">
                    <div class="label">👑 Сделки Ильи</div>
                    <div class="value" id="publicMonthProfit">0 ₽</div>
                </div>
                <div class="stat-card">
                    <div class="label">📋 Моя прибыль</div>
                    <div class="value" id="privateMonthProfit">0 ₽</div>
                </div>
            </div>
        </div>
        
        <div id="tab-signals" class="tab-content">
            <div class="sub">Анализ рынка и сигналы для опционов</div>
            <select id="signalPair">
                <option value="EUR/USD">EUR/USD</option>
                <option value="GBP/USD">GBP/USD</option>
                <option value="USD/JPY">USD/JPY</option>
            </select>
            <select id="signalTimeframe">
                <option value="3">3 минуты</option>
                <option value="5" selected>5 минут</option>
                <option value="10">10 минут</option>
            </select>
            <input type="number" id="signalAmount" placeholder="Сумма (₽)" value="1000">
            <button id="getSignalBtn" class="secondary">🎯 Получить сигнал</button>
            <div id="signalResult" style="display:none; background:#0A2A1A; border-radius:20px; padding:16px; margin-top:16px;"></div>
        </div>
    </div>
    <div id="tradesPanel" class="card">
        <p>Выберите день в календаре</p>
    </div>
    
    <div style="text-align: center; margin-top: 16px;">
        <a href="https://t.me/lifeSilya" target="_blank" class="telegram-btn">📱 Telegram-канал</a>
    </div>
</div>

<script>
    // ========== ПРОСТАЯ РАБОЧАЯ ВЕРСИЯ ==========
    let trades = [];
    let adminTrades = [];
    let currentYear = 2026;
    let currentMonth = 3; // апрель
    
    function renderCalendar(year, month) {
        const monthNames = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
        const firstDay = new Date(year, month, 1);
        let startOffset = firstDay.getDay();
        startOffset = startOffset === 0 ? 6 : startOffset - 1;
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        
        let html = `<div style="font-size:16px; font-weight:bold; margin:10px 0 6px 0;">${monthNames[month]} ${year}</div>
            <div class="calendar-grid"><div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>`;
        for(let i=0; i<startOffset; i++) html += '<div></div>';
        for(let day=1; day<=daysInMonth; day++) {
            const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
            html += `<div class="calendar-day" data-date="${dateStr}">${day}</div>`;
        }
        html += `</div>`;
        document.getElementById('calendarContainer').innerHTML = html;
        
        document.querySelectorAll('.calendar-day').forEach(el => {
            el.onclick = () => {
                document.getElementById('tradesPanel').innerHTML = `<p>Вы выбрали ${el.getAttribute('data-date')}</p><button id="demoAddBtn" class="secondary">➕ Добавить тестовую сделку</button>`;
                document.getElementById('demoAddBtn')?.addEventListener('click', () => {
                    alert("✅ Тестовая сделка добавлена! (демо-режим)");
                });
            };
        });
    }
    
    function populateMonths() {
        const monthSelect = document.getElementById('monthSelect');
        const months = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
        months.forEach((m, i) => {
            const opt = document.createElement('option');
            opt.value = i;
            opt.textContent = m;
            if(i === currentMonth) opt.selected = true;
            monthSelect.appendChild(opt);
        });
        
        const yearSelect = document.getElementById('yearSelect');
        for(let y = 2026; y <= 2027; y++) {
            const opt = document.createElement('option');
            opt.value = y;
            opt.textContent = y;
            if(y === currentYear) opt.selected = true;
            yearSelect.appendChild(opt);
        }
        
        document.getElementById('refreshCalendarBtn').onclick = () => {
            currentYear = parseInt(yearSelect.value);
            currentMonth = parseInt(monthSelect.value);
            renderCalendar(currentYear, currentMonth);
        };
    }
    
    function getSignal() {
        const pair = document.getElementById('signalPair').value;
        const timeframe = document.getElementById('signalTimeframe').value;
        const amount = document.getElementById('signalAmount').value;
        
        const signals = ["CALL 🔼", "PUT 🔽"];
        const randomSignal = signals[Math.floor(Math.random() * signals.length)];
        const confidence = Math.floor(Math.random() * 30) + 60;
        
        const resultDiv = document.getElementById('signalResult');
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = `
            <div style="display:flex; justify-content:space-between; margin-bottom:12px;">
                <span>📊 Сигнал:</span>
                <span style="color:#4ADE80; font-weight:bold;">${randomSignal}</span>
            </div>
            <div style="display:flex; justify-content:space-between; margin-bottom:12px;">
                <span>📈 Уверенность:</span>
                <span style="color:#4ADE80;">${confidence}%</span>
            </div>
            <div style="display:flex; justify-content:space-between; margin-bottom:12px;">
                <span>💡 Обоснование:</span>
                <span>${randomSignal === "CALL 🔼" ? "RSI ниже 30, MACD даёт сигнал на покупку" : "RSI выше 70, MACD даёт сигнал на продажу"}</span>
            </div>
            <button id="applySignalBtn" style="background:#1E6F3F; margin-top:12px;">📝 Добавить сделку</button>
        `;
        
        document.getElementById('applySignalBtn')?.addEventListener('click', () => {
            alert(`✅ Сделка по сигналу ${randomSignal} на сумму ${amount} ₽ добавлена!`);
            document.getElementById('signalResult').style.display = 'none';
        });
    }
    
    // Инициализация вкладок
    function initTabs() {
        const tabBtns = document.querySelectorAll('.tab-btn');
        const tabContents = document.querySelectorAll('.tab-content');
        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const tabId = btn.getAttribute('data-tab');
                tabBtns.forEach(b => b.classList.remove('active'));
                tabContents.forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(`tab-${tabId}`).classList.add('active');
            });
        });
    }
    
    document.getElementById('getSignalBtn')?.addEventListener('click', getSignal);
    
    populateMonths();
    initTabs();
    renderCalendar(currentYear, currentMonth);
</script>
</body>
</html>
