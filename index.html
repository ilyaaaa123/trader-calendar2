<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Календарь трейдера — lifeSilya</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0A192F;
            font-family: 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            color: #F0F4F8;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .card {
            background: #11243E;
            border-radius: 32px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid #2C4F6E;
        }
        .header {
            font-size: 28px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .sub {
            color: #8BB4D0;
            font-size: 14px;
            margin: 10px 0 20px 0;
            border-left: 2px solid #2E7EB8;
            padding-left: 12px;
        }
        button {
            background: #1E6F3F;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: bold;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }
        button.danger { background: #8B2C2C; }
        button.secondary { background: #2C5282; }
        button.warning { background: #B1661A; }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            background: #0A1A2A;
            border: 1px solid #2E4A6A;
            border-radius: 20px;
            color: white;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            text-align: center;
            margin-top: 16px;
        }
        .calendar-day {
            padding: 10px;
            border-radius: 40px;
            cursor: pointer;
            background: #0A1A2A;
        }
        .calendar-day.trade-day { background: #1E6F3F; }
        .calendar-day.loss-day { background: #B1661A; }
        .trade-item {
            background: #0E1C2C;
            border-radius: 20px;
            padding: 12px;
            margin-bottom: 12px;
            border-left: 4px solid #2E7EB8;
        }
        .profit { color: #4ADE80; }
        .loss { color: #F87171; }
        .direction-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }
        .dir-btn {
            flex: 1;
            background: #1F3A4B;
        }
        .dir-active-long {
            background: #1E6F3F;
            box-shadow: 0 0 0 2px #4ADE80;
        }
        .dir-active-short {
            background: #8B2C2C;
            box-shadow: 0 0 0 2px #F87171;
        }
        .add-buttons {
            display: flex;
            gap: 12px;
            margin: 16px 0;
        }
        .add-buttons button { flex: 1; }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #11243E;
            border-radius: 32px;
            padding: 20px;
            width: 95%;
            max-width: 500px;
            max-height: 85%;
            overflow: auto;
        }
        .winrate-badge {
            background: #1E3A5F;
            padding: 6px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 12px;
        }
        hr { border-color: #2C4F6E; margin: 12px 0; }
        .month-selector {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .month-selector select { width: auto; margin-bottom: 0; }
        .violation-note {
            background: #8B2C2C;
            padding: 8px;
            border-radius: 16px;
            margin-top: 8px;
            font-size: 13px;
        }
        .dots-menu { position: relative; display: inline-block; }
        .dots-btn {
            background: none;
            border: none;
            font-size: 28px;
            font-weight: bold;
            color: #8BB4D0;
            cursor: pointer;
            padding: 0 8px;
            line-height: 1;
        }
        .telegram-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #0088cc;
            text-decoration: none;
            padding: 10px 24px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
        }
        .admin-badge {
            background: #FACC15;
            color: #0A192F;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="header">
            <div>
                📅 Календарь трейдера
                <span id="adminBadge" style="display:none;" class="admin-badge">👑 Администратор</span>
            </div>
            <div class="dots-menu">
                <button class="dots-btn" id="dotsBtn">⋮</button>
                <div id="dropdownMenu" style="display:none; position:absolute; right:0; top:35px; background:#11243E; border-radius:20px; overflow:hidden;">
                    <button id="devMenuBtn" style="width:100%; text-align:left;">🔐 Для разработчиков</button>
                </div>
            </div>
        </div>
        <div class="sub">lifeSilya • EUR/USD, CAD/USD</div>
        
        <div class="month-selector">
            <select id="monthSelect"></select>
            <select id="yearSelect"></select>
            <button id="refreshCalendarBtn">Показать</button>
        </div>
        <div id="calendarContainer"></div>
    </div>
    <div id="tradesPanel" class="card"></div>
    
    <div style="text-align: center; margin-top: 20px;">
        <a href="https://t.me/lifeSilya" target="_blank" class="telegram-btn">📱 Подписаться на Telegram-канал</a>
    </div>
</div>

<div id="devModal" class="modal"><div class="modal-content"><h3>🔐 Для разработчиков</h3><p>Доступ только для администратора.</p><button id="closeDevBtn" class="secondary">Закрыть</button></div></div>
<div id="addTradeModal" class="modal"><div class="modal-content" id="addTradeForm"></div></div>
<div id="violationModal" class="modal"><div class="modal-content"><h3>⚠️ Нарушение риск-менеджмента</h3><textarea id="violationComment" placeholder="Опишите нарушение..." rows="3"></textarea><button id="saveViolationBtn">Сохранить</button><button id="closeViolationBtn" class="secondary">Отмена</button></div></div>
<div id="usersModal" class="modal"><div class="modal-content"><h3>👥 Пользователи бота</h3><div id="usersList"></div><button id="closeUsersBtn" class="secondary">Закрыть</button></div></div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
    const ADMIN_IDS = [8326017499];
    let isAdmin = false;
    let tg = null;
    let currentUserId = null;
    
    try {
        tg = window.Telegram?.WebApp;
        if(tg) {
            tg.expand();
            tg.ready();
            const user = tg.initDataUnsafe?.user;
            if(user) {
                currentUserId = user.id;
                if(ADMIN_IDS.includes(user.id)) {
                    isAdmin = true;
                    document.getElementById('adminBadge').style.display = 'inline-block';
                }
            }
        }
    } catch(e) {}
    
    if(!currentUserId) {
        currentUserId = "demo_" + Date.now();
    }
    
    function registerUser() {
        let allUsers = JSON.parse(localStorage.getItem("all_users") || "[]");
        const exists = allUsers.find(u => u.id === currentUserId);
        if(!exists) {
            let userName = "Пользователь";
            if(tg?.initDataUnsafe?.user) {
                userName = tg.initDataUnsafe.user.first_name || "Аноним";
            }
            allUsers.push({ id: currentUserId, name: userName, first_seen: new Date().toISOString() });
            localStorage.setItem("all_users", JSON.stringify(allUsers));
        }
    }
    
    let adminTrades = [];
    let guestTrades = [];
    let violations = [];
    let selectedDateForAdd = null;
    let pendingViolationDate = null;
    let currentYear = 2026;
    let currentMonth = 3;
    
    function loadTrades() {
        adminTrades = JSON.parse(localStorage.getItem("admin_trades_calendar") || "[]");
        guestTrades = JSON.parse(localStorage.getItem(`trades_${currentUserId}`) || "[]");
        violations = JSON.parse(localStorage.getItem(`violations_${currentUserId}`) || "[]");
        renderCalendar(currentYear, currentMonth);
    }
    
    function saveTrades() {
        localStorage.setItem("admin_trades_calendar", JSON.stringify(adminTrades));
        localStorage.setItem(`trades_${currentUserId}`, JSON.stringify(guestTrades));
        localStorage.setItem(`violations_${currentUserId}`, JSON.stringify(violations));
    }
    
    function addViolation(date, comment) {
        violations = violations.filter(v => v.date !== date);
        violations.push({ date, comment });
        saveTrades();
        renderCalendar(currentYear, currentMonth);
        if(selectedDateForAdd === date) showTradesForDate(date);
    }
    
    function getViolationForDate(date) {
        return violations.find(v => v.date === date);
    }
    
    function addTrade(trade, isGlobal = false) {
        if(isGlobal && isAdmin) adminTrades.push(trade);
        else guestTrades.push(trade);
        saveTrades();
        renderCalendar(currentYear, currentMonth);
        if(selectedDateForAdd) showTradesForDate(selectedDateForAdd);
    }
    
    function deleteAdminTrade(id) {
        if(confirm("Удалить общую сделку?")) {
            adminTrades = adminTrades.filter(t => t.id !== id);
            saveTrades();
            renderCalendar(currentYear, currentMonth);
            if(selectedDateForAdd) showTradesForDate(selectedDateForAdd);
        }
    }
    
    function deleteGuestTrade(id) {
        if(confirm("Удалить сделку?")) {
            guestTrades = guestTrades.filter(t => t.id !== id);
            saveTrades();
            renderCalendar(currentYear, currentMonth);
            if(selectedDateForAdd) showTradesForDate(selectedDateForAdd);
        }
    }
    
    function showTradesForDate(dateStr) {
        const panel = document.getElementById('tradesPanel');
        const dayAdminTrades = adminTrades.filter(t => t.date === dateStr);
        const dayGuestTrades = guestTrades.filter(t => t.date === dateStr);
        const violation = getViolationForDate(dateStr);
        let allTrades = [...dayGuestTrades, ...dayAdminTrades];
        
        if(allTrades.length === 0 && !violation) {
            panel.innerHTML = `<div><h3>📅 ${dateStr}</h3><p>📭 В этот день сделок нет.</p>
                <button id="addFromPanelBtn" class="secondary">➕ Добавить сделку</button>
                <button id="violationFromPanelBtn" class="warning">⚠️ Добавить нарушение</button>
            </div>`;
            document.getElementById('addFromPanelBtn')?.addEventListener('click', () => openAddTradeModal(dateStr));
            document.getElementById('violationFromPanelBtn')?.addEventListener('click', () => openViolationModal(dateStr));
            return;
        }
        
        let profitTotal = 0, win = 0, loss = 0;
        allTrades.forEach(t => {
            profitTotal += t.profit;
            if(t.profit > 0) win++;
            if(t.profit < 0) loss++;
        });
        const winrate = allTrades.length ? Math.round((win/allTrades.length)*100) : 0;
        
        let html = `<div>
            <h3>📅 ${dateStr}</h3>
            <div class="winrate-badge">📊 Винрейт: ${winrate}% (${win}/${allTrades.length})</div>
            <div>💰 Прибыль дня: ${profitTotal > 0 ? '+' : ''}${profitTotal.toFixed(2)} ₽</div>
            ${violation ? `<div class="violation-note">⚠️ Нарушение: ${violation.comment}</div>` : ''}
            <hr>
        `;
        
        if(dayAdminTrades.length > 0) {
            html += `<div><strong>👑 Общие сделки (от администратора):</strong></div>`;
            dayAdminTrades.forEach(t => {
                html += `<div class="trade-item">
                    <div><strong>${t.time}</strong> | ${t.instrument} | ${t.direction}</div>
                    <div>💰 ${t.amount} ₽ ${t.isLoss ? '' : `| ${t.payoutPercent}%`}</div>
                    <div class="${t.profit > 0 ? 'profit' : 'loss'}">${t.isLoss ? `❌ УБЫТОК: -${t.amount} ₽` : `✅ ИТОГ: ${(t.amount + t.profit).toFixed(2)} ₽`}</div>
                    ${t.comment ? `<div>📝 ${t.comment}</div>` : ''}
                    ${isAdmin ? `<button class="danger" data-admin-id="${t.id}">🗑️ Удалить</button>` : ''}
                </div>`;
            });
        }
        
        if(dayGuestTrades.length > 0) {
            html += `<div><strong>📋 Мои сделки:</strong></div>`;
            dayGuestTrades.forEach(t => {
                html += `<div class="trade-item">
                    <div><strong>${t.time}</strong> | ${t.instrument} | ${t.direction}</div>
                    <div>💰 ${t.amount} ₽ ${t.isLoss ? '' : `| ${t.payoutPercent}%`}</div>
                    <div class="${t.profit > 0 ? 'profit' : 'loss'}">${t.isLoss ? `❌ УБЫТОК: -${t.amount} ₽` : `✅ ИТОГ: ${(t.amount + t.profit).toFixed(2)} ₽`}</div>
                    ${t.comment ? `<div>📝 ${t.comment}</div>` : ''}
                    <button class="danger" data-guest-id="${t.id}">🗑️ Удалить</button>
                </div>`;
            });
        }
        
        html += `<hr><button id="addFromPanelBtn" class="secondary">➕ Добавить сделку</button>
            <button id="violationFromPanelBtn" class="warning">⚠️ Добавить/изменить нарушение</button>
        </div>`;
        panel.innerHTML = html;
        
        document.getElementById('addFromPanelBtn')?.addEventListener('click', () => openAddTradeModal(dateStr));
        document.getElementById('violationFromPanelBtn')?.addEventListener('click', () => openViolationModal(dateStr));
        document.querySelectorAll('[data-admin-id]').forEach(btn => {
            btn.onclick = () => deleteAdminTrade(parseInt(btn.dataset.adminId));
        });
        document.querySelectorAll('[data-guest-id]').forEach(btn => {
            btn.onclick = () => deleteGuestTrade(parseInt(btn.dataset.guestId));
        });
    }
    
    function openViolationModal(dateStr) {
        pendingViolationDate = dateStr;
        const existing = getViolationForDate(dateStr);
        document.getElementById('violationComment').value = existing ? existing.comment : '';
        document.getElementById('violationModal').style.display = 'flex';
    }
    
    function openAddTradeModal(dateStr, isGlobal = false) {
        selectedDateForAdd = dateStr;
        const formDiv = document.getElementById('addTradeForm');
        const title = isGlobal ? "➕ Добавить ОБЩУЮ сделку" : "➕ Добавить сделку";
        formDiv.innerHTML = `
            <h3>${title} на ${dateStr}</h3>
            <input type="time" id="tradeTime" value="18:00">
            <select id="tradeInstrument">
                <option value="EUR/USD">EUR/USD</option>
                <option value="CAD/USD">CAD/USD</option>
            </select>
            <div class="direction-buttons">
                <button id="longBtn" class="dir-btn">📈 LONG</button>
                <button id="shortBtn" class="dir-btn">📉 SHORT</button>
            </div>
            <div class="add-buttons">
                <button id="profitTypeBtn" style="background:#1E6F3F;">✅ Прибыль</button>
                <button id="lossTypeBtn" class="danger">❌ Убыток</button>
            </div>
            <div id="profitFields" style="display:none;">
                <input type="number" id="profitAmount" placeholder="Сумма (₽)" value="1000">
                <input type="number" id="profitPercent" placeholder="Процент (20-92)" value="89">
                <div id="profitPreview" style="background:#0A2A1A; padding:10px; border-radius:20px; margin:10px 0;">💵 Итог: 0 ₽</div>
                <textarea id="profitComment" placeholder="Комментарий"></textarea>
                <button id="submitProfitBtn">✅ Добавить</button>
            </div>
            <div id="lossFields" style="display:none;">
                <input type="number" id="lossAmount" placeholder="Сумма убытка (₽)" value="1000">
                <textarea id="lossComment" placeholder="Комментарий"></textarea>
                <button id="submitLossBtn" class="danger">❌ Добавить убыток</button>
            </div>
            <button id="closeAddModal" class="secondary">Отмена</button>
        `;
        
        let direction = "LONG";
        const longBtn = document.getElementById('longBtn');
        const shortBtn = document.getElementById('shortBtn');
        const profitTypeBtn = document.getElementById('profitTypeBtn');
        const lossTypeBtn = document.getElementById('lossTypeBtn');
        const profitFields = document.getElementById('profitFields');
        const lossFields = document.getElementById('lossFields');
        
        function updateDirUI() {
            if(direction === "LONG") {
                longBtn.classList.add('dir-active-long');
                shortBtn.classList.remove('dir-active-short');
            } else {
                shortBtn.classList.add('dir-active-short');
                longBtn.classList.remove('dir-active-long');
            }
        }
        longBtn.onclick = () => { direction = "LONG"; updateDirUI(); };
        shortBtn.onclick = () => { direction = "SHORT"; updateDirUI(); };
        updateDirUI();
        
        profitTypeBtn.onclick = () => {
            profitFields.style.display = 'block';
            lossFields.style.display = 'none';
            const amountInp = document.getElementById('profitAmount');
            const percentInp = document.getElementById('profitPercent');
            const preview = document.getElementById('profitPreview');
            function updatePreview() {
                let amount = parseFloat(amountInp?.value) || 0;
                let percent = parseFloat(percentInp?.value) || 0;
                if(percent < 20) percent = 20;
                if(percent > 92) percent = 92;
                const profit = amount * percent / 100;
                const total = amount + profit;
                preview.innerHTML = `💵 Итог: ${total.toFixed(2)} ₽ (прибыль: +${profit.toFixed(2)} ₽)`;
            }
            amountInp.addEventListener('input', updatePreview);
            percentInp.addEventListener('input', updatePreview);
            updatePreview();
            document.getElementById('submitProfitBtn').onclick = () => {
                let amount = parseFloat(amountInp.value) || 0;
                let percent = parseFloat(percentInp.value) || 0;
                if(percent < 20) percent = 20;
                if(percent > 92) percent = 92;
                const comment = document.getElementById('profitComment').value;
                if(amount <= 0) return alert("Введите сумму");
                const profit = amount * percent / 100;
                addTrade({
                    id: Date.now(), date: dateStr, time: document.getElementById('tradeTime').value,
                    instrument: document.getElementById('tradeInstrument').value, direction: direction,
                    amount: amount, payoutPercent: percent, profit: profit, comment: comment, isLoss: false
                }, isGlobal);
                document.getElementById('addTradeModal').style.display = 'none';
            };
        };
        
        lossTypeBtn.onclick = () => {
            lossFields.style.display = 'block';
            profitFields.style.display = 'none';
            document.getElementById('submitLossBtn').onclick = () => {
                let amount = parseFloat(document.getElementById('lossAmount').value) || 0;
                const comment = document.getElementById('lossComment').value;
                if(amount <= 0) return alert("Введите сумму");
                addTrade({
                    id: Date.now(), date: dateStr, time: document.getElementById('tradeTime').value,
                    instrument: document.getElementById('tradeInstrument').value, direction: direction,
                    amount: amount, payoutPercent: null, profit: -amount, comment: comment, isLoss: true
                }, isGlobal);
                document.getElementById('addTradeModal').style.display = 'none';
            };
        };
        
        document.getElementById('closeAddModal').onclick = () => {
            document.getElementById('addTradeModal').style.display = 'none';
        };
        document.getElementById('addTradeModal').style.display = 'flex';
    }
    
    function renderCalendar(year, month) {
        const tradeDaysSet = new Set();
        const lossDaysSet = new Set();
        const allTrades = [...guestTrades, ...adminTrades];
        const dayProfit = {};
        allTrades.forEach(t => {
            if(!dayProfit[t.date]) dayProfit[t.date] = 0;
            dayProfit[t.date] += t.profit;
        });
        allTrades.forEach(t => tradeDaysSet.add(t.date));
        for(const date in dayProfit) if(dayProfit[date] < 0) lossDaysSet.add(date);
        
        const monthNames = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
        const firstDay = new Date(year, month, 1);
        let startOffset = firstDay.getDay();
        startOffset = startOffset === 0 ? 6 : startOffset - 1;
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        
        let html = `<div style="font-size:18px; font-weight:bold; margin:16px 0 8px 0;">${monthNames[month]} ${year}</div>
            <div class="calendar-grid"><div style="font-weight:bold;">Пн</div><div style="font-weight:bold;">Вт</div><div style="font-weight:bold;">Ср</div><div style="font-weight:bold;">Чт</div><div style="font-weight:bold;">Пт</div><div style="font-weight:bold;">Сб</div><div style="font-weight:bold;">Вс</div>`;
        for(let i=0; i<startOffset; i++) html += '<div></div>';
        for(let day=1; day<=daysInMonth; day++) {
            const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
            let dayClass = '';
            if(lossDaysSet.has(dateStr)) dayClass = 'loss-day';
            else if(tradeDaysSet.has(dateStr)) dayClass = 'trade-day';
            html += `<div class="calendar-day ${dayClass}" data-date="${dateStr}">${day}</div>`;
        }
        html += `</div>`;
        document.getElementById('calendarContainer').innerHTML = html;
        document.querySelectorAll('.calendar-day').forEach(el => {
            const date = el.getAttribute('data-date');
            if(date) el.onclick = () => { selectedDateForAdd = date; showTradesForDate(date); };
        });
        const defaultDate = `${year}-${String(month+1).padStart(2,'0')}-01`;
        showTradesForDate(defaultDate);
    }
    
    function showUsersList() {
        const allUsers = JSON.parse(localStorage.getItem("all_users") || "[]");
        const usersListDiv = document.getElementById('usersList');
        if(allUsers.length === 0) {
            usersListDiv.innerHTML = "<p>Нет зарегистрированных пользователей</p>";
        } else {
            let html = "";
            allUsers.forEach(u => {
                const userTrades = JSON.parse(localStorage.getItem(`trades_${u.id}`) || "[]");
                let totalProfit = 0, tradeCount = userTrades.length;
                userTrades.forEach(t => totalProfit += t.profit);
                html += `<div class="user-list-item">
                    <div><strong>${u.name}</strong></div>
                    <div>🆔 ${u.id}</div>
                    <div>📊 Сделок: ${tradeCount} | Прибыль: ${totalProfit > 0 ? '+' : ''}${totalProfit.toFixed(2)} ₽</div>
                    <div>📅 Первый визит: ${u.first_seen?.slice(0,10) || '—'}</div>
                </div>`;
            });
            usersListDiv.innerHTML = html;
        }
        document.getElementById('usersModal').style.display = 'flex';
    }
    
    function populateMonthYearSelectors() {
        const monthSelect = document.getElementById('monthSelect');
        const yearSelect = document.getElementById('yearSelect');
        const months = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
        months.forEach((m, idx) => {
            const option = document.createElement('option');
            option.value = idx;
            option.textContent = m;
            if(idx === currentMonth) option.selected = true;
            monthSelect.appendChild(option);
        });
        for(let y=2026; y<=2027; y++) {
            const option = document.createElement('option');
            option.value = y;
            option.textContent = y;
            if(y === currentYear) option.selected = true;
            yearSelect.appendChild(option);
        }
        document.getElementById('refreshCalendarBtn').onclick = () => {
            currentYear = parseInt(yearSelect.value);
            currentMonth = parseInt(monthSelect.value);
            renderCalendar(currentYear, currentMonth);
        };
    }
    
    const dotsBtn = document.getElementById('dotsBtn');
    const dropdownMenu = document.getElementById('dropdownMenu');
    dotsBtn.onclick = (e) => { 
        e.stopPropagation(); 
        dropdownMenu.style.display = dropdownMenu.style.display === 'block' ? 'none' : 'block';
    };
    window.onclick = () => { dropdownMenu.style.display = 'none'; };
    
    function updateAdminMenu() {
        const menu = document.getElementById('dropdownMenu');
        if(isAdmin) {
            menu.innerHTML = `
                <button id="usersListBtn" style="width:100%; text-align:left; background:none; color:white;">👥 Список пользователей</button>
                <button id="globalTradeBtn" style="width:100%; text-align:left; background:none; color:white;">👑 Добавить общую сделку</button>
                <button id="logoutDevBtn" class="danger" style="width:100%; text-align:left;">🚪 Выйти из режима администратора</button>
            `;
            document.getElementById('usersListBtn')?.addEventListener('click', () => showUsersList());
            document.getElementById('globalTradeBtn')?.addEventListener('click', () => {
                const today = new Date().toISOString().slice(0,10);
                openAddTradeModal(today, true);
            });
            document.getElementById('logoutDevBtn')?.addEventListener('click', () => {
                isAdmin = false;
                document.getElementById('adminBadge').style.display = 'none';
                updateAdminMenu();
                renderCalendar(currentYear, currentMonth);
                alert("👋 Вы вышли из режима администратора");
            });
        } else {
            menu.innerHTML = `<button id="devMenuBtn" style="width:100%; text-align:left; background:none; color:white;">🔐 Для разработчиков</button>`;
            document.getElementById('devMenuBtn')?.addEventListener('click', () => {
                dropdownMenu.style.display = 'none';
                if(currentUserId && ADMIN_IDS.includes(parseInt(currentUserId))) {
                    isAdmin = true;
                    document.getElementById('adminBadge').style.display = 'inline-block';
                    updateAdminMenu();
                    renderCalendar(currentYear, currentMonth);
                    alert("✅ Режим администратора активирован");
                } else {
                    alert("⛔ Доступ только для администратора");
                }
            });
        }
    }
    
    document.getElementById('closeDevBtn').onclick = () => document.getElementById('devModal').style.display = 'none';
    document.getElementById('closeUsersBtn').onclick = () => document.getElementById('usersModal').style.display = 'none';
    document.getElementById('saveViolationBtn').onclick = () => {
        const comment = document.getElementById('violationComment').value.trim();
        if(!comment) return alert("Введите комментарий");
        if(pendingViolationDate) addViolation(pendingViolationDate, comment);
        document.getElementById('violationModal').style.display = 'none';
        document.getElementById('violationComment').value = '';
        pendingViolationDate = null;
    };
    document.getElementById('closeViolationBtn').onclick = () => {
        document.getElementById('violationModal').style.display = 'none';
        pendingViolationDate = null;
    };
    window.onclick = (e) => {
        if(e.target === document.getElementById('devModal')) document.getElementById('devModal').style.display = 'none';
        if(e.target === document.getElementById('addTradeModal')) document.getElementById('addTradeModal').style.display = 'none';
        if(e.target === document.getElementById('violationModal')) document.getElementById('violationModal').style.display = 'none';
        if(e.target === document.getElementById('usersModal')) document.getElementById('usersModal').style.display = 'none';
    };
    
    registerUser();
    populateMonthYearSelectors();
    updateAdminMenu();
    loadTrades();
</script>
</body>
</html>
