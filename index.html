<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Календарь трейдера — lifeSilya</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0A192F;
            font-family: 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            color: white;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .card {
            background: #11243E;
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 20px;
        }
        h1 { font-size: 24px; margin-bottom: 10px; }
        .sub { color: #8BB4D0; font-size: 14px; margin-bottom: 20px; }
        button {
            background: #1E6F3F;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            margin-right: 10px;
        }
        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            text-align: center;
        }
        .day {
            background: #0A1A2A;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
        }
        .day:hover { background: #2C5282; }
        .telegram-btn {
            display: inline-block;
            background: #0088cc;
            text-decoration: none;
            padding: 10px 24px;
            border-radius: 40px;
            color: white;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1>📅 Календарь трейдера</h1>
        <div class="sub">lifeSilya • Валютные пары EUR/USD, GBP/USD, USD/JPY</div>
        
        <div id="calendar"></div>
        
        <div style="margin-top: 20px;">
            <button id="addDemoBtn">➕ Добавить тестовую сделку</button>
        </div>
        
        <div id="trades" style="margin-top: 20px;"></div>
    </div>
    
    <div style="text-align: center;">
        <a href="https://t.me/lifeSilya" target="_blank" class="telegram-btn">📱 Telegram-канал</a>
    </div>
</div>

<script>
    let trades = [];
    let currentYear = 2026;
    let currentMonth = 3;
    
    // Кэширование элементов и констант
    const calendarEl = document.getElementById('calendar');
    const tradesEl = document.getElementById('trades');
    const monthNames = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
    const weekdays = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
    
    function renderCalendar() {
        const firstDay = new Date(currentYear, currentMonth, 1);
        let startOffset = firstDay.getDay();
        startOffset = startOffset === 0 ? 6 : startOffset - 1;
        const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
        
        // Быстрая сборка HTML через массив
        const html = [
            `<div style="font-size:18px; font-weight:bold; margin-bottom:10px;">${monthNames[currentMonth]} ${currentYear}</div>`,
            '<div class="calendar">'
        ];
        
        for (let i = 0; i < 7; i++) {
            html.push(`<div style="font-weight:bold;">${weekdays[i]}</div>`);
        }
        
        for(let i = 0; i < startOffset; i++) {
            html.push('<div></div>');
        }
        
        for(let day = 1; day <= daysInMonth; day++) {
            html.push(`<div class="day" data-day="${day}">${day}</div>`);
        }
        
        html.push('</div>');
        calendarEl.innerHTML = html.join('');
    }
    
    // Делегирование событий
    calendarEl.addEventListener('click', (e) => {
        const dayEl = e.target.closest('.day');
        if (dayEl) {
            const day = dayEl.getAttribute('data-day');
            const date = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
            showTrades(date);
        }
    });
    
    function showTrades(date) {
        const dayTrades = trades.filter(t => t.date === date);
        
        if(dayTrades.length === 0) {
            tradesEl.innerHTML = `<p>📭 ${date} — сделок нет</p>`;
        } else {
            const tradeHtml = dayTrades.map(t => 
                `<div style="background:#0A1A2A; padding:8px; margin-top:8px; border-radius:12px;">
                    ${t.time} | ${t.instrument} | ${t.direction}<br>
                    💰 ${t.amount} ₽ → ${t.profit > 0 ? '+' : ''}${t.profit} ₽
                </div>`
            ).join('');
            
            tradesEl.innerHTML = `<strong>📋 Сделки за ${date}:</strong><br>${tradeHtml}`;
        }
    }
    
    document.getElementById('addDemoBtn').addEventListener('click', () => {
        const today = new Date().toISOString().slice(0,10);
        const newTrade = {
            id: Date.now(),
            date: today,
            time: new Date().toLocaleTimeString().slice(0,5),
            instrument: "EUR/USD",
            direction: "CALL",
            amount: 1000,
            profit: 920
        };
        trades.push(newTrade);
        showTrades(today);
        alert("✅ Тестовая сделка добавлена!");
    });
    
    renderCalendar();
</script>
</body>
</html>
